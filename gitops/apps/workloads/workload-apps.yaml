apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-workloads-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Bhomesh/eks-gitops-platform-blueprint.git'
    targetRevision: HEAD
    path: gitops/environments/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: banking-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
