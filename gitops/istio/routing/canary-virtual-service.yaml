apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: payment-core-destination
  namespace: banking-prod
spec:
  host: payment-core
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 1024
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2-canary
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: payment-core-routes
  namespace: banking-prod
spec:
  hosts:
    - payment-core
  http:
    - route:
        - destination:
            host: payment-core
            subset: v1
          weight: 90
        - destination:
            host: payment-core
            subset: v2-canary
          weight: 10
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: "5xx,connect-failure,refused-stream"
